[package]
name = "monitor-off"
version = "1.0.0"
edition = "2021"
description = "关闭显示器（仅熄屏，不休眠）"

[[bin]]
name = "MonitorOff"
path = "src/main.rs"

[profile.release]
opt-level = "z"      # 最小体积优化
lto = true           # 链接期优化
strip = true         # 去除符号表
panic = "abort"      # 去除 unwind 运行时
codegen-units = 1    # 单编译单元，最大化优化